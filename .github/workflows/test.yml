name: Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start services
        run: docker compose --env-file .env.prod up -d --build postgres localstack keycloak app proxy

      - name: Run tests
        run: bun test
        env:
          KEYCLOAK_JWKS_URI: http://localhost:3000/realms/wagering/protocol/openid-connect/certs
          KEYCLOAK_ISSUER: http://localhost:3000/realms/wagering
